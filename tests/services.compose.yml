services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: disposable-test-password
      POSTGRES_DB: agentmoor
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  s3:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: disposable-test
      MINIO_ROOT_PASSWORD: disposable-test-password
    ports:
      - "127.0.0.1::9000"
