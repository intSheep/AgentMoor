apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentmoor-dispatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentmoor-turn-jobs
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentmoor-turn-jobs
subjects:
- kind: ServiceAccount
  name: agentmoor-dispatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentmoor-turn-jobs
